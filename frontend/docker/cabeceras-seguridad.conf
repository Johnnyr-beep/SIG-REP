# Cabeceras de endurecimiento (OWASP Secure Headers).
#
# Están en un fragmento aparte por una regla de nginx que muerde en silencio:
# `add_header` **no se hereda** en un bloque que declare su propio `add_header`.
# Basta un `add_header Cache-Control …` dentro de un `location` para que ese
# `location` pierda la CSP, `X-Frame-Options` y todo lo demás definido arriba,
# sin ningún aviso ni error de configuración.
#
# El síntoma es peor que un fallo: la aplicación funciona con normalidad y solo
# un `curl -D -` sobre la ruta afectada revela que las cabeceras no están. Y la
# ruta afectada es justamente `/index.html`, el documento que carga todo lo
# demás y el único donde la CSP importa de verdad.
#
# Por eso este archivo se incluye explícitamente en cada `location` que añada
# cabeceras propias.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP estricta: la aplicación no carga scripts ni estilos de terceros, así que
# no hace falta abrir la política a ningún CDN. `connect-src 'self'` limita las
# llamadas al mismo origen, donde el proxy publica /api.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
