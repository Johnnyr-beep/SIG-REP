# Servidor del frontend de SIGREP.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión del servidor.
    server_tokens off;

    # Los reportes de clientes pueden ser grandes y la exportación a Excel viaja
    # por esta misma ruta; 20 MB deja margen sin abrir la puerta a subidas
    # arbitrarias.
    client_max_body_size 20m;

    # Cabeceras de endurecimiento. Se incluyen aquí y **otra vez** en cada
    # `location` que declare cabeceras propias: ver el porqué en el fragmento.
    include /etc/nginx/conf.d/cabeceras-seguridad.inc;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        include /etc/nginx/conf.d/cabeceras-seguridad.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # El índice nunca se cachea: es lo que apunta a la versión vigente de los
    # assets, y servirlo viejo dejaría al usuario en una versión anterior.
    location = /index.html {
        include /etc/nginx/conf.d/cabeceras-seguridad.inc;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # La API se sirve por el mismo origen para evitar CORS y cookies de terceros.
    # El cliente del frontend llama a `/api/v1/...` (ver src/api/cliente.ts).
    location /api/ {
        # El destino va en una variable a propósito.
        #
        # Con un nombre literal, nginx resuelve `api` **al arrancar** y aborta
        # con «host not found in upstream» si todavía no existe. Eso ata el
        # servidor web a la disponibilidad de la API en el momento del
        # arranque: si la API tarda en migrar o está caída, la interfaz tampoco
        # se sirve, y el usuario ve una caída total en vez de un error al pedir
        # datos.
        #
        # Con una variable, la resolución se difiere a cada petición. nginx
        # arranca siempre, sirve la aplicación, y si la API no responde
        # devuelve 502 solo en las llamadas a `/api/`.
        #
        # `127.0.0.11` es el DNS interno de Docker; `ipv6=off` evita que
        # intente AAAA en redes que solo tienen IPv4 y sume latencia.
        resolver 127.0.0.11 ipv6=off valid=10s;
        resolver_timeout 5s;
        set $destino_api http://api:8000;

        proxy_pass $destino_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un consolidado de dieciséis puntos por ocho categorías, o una
        # exportación a Excel, tardan más que una petición corriente.
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Enrutamiento del lado del cliente: cualquier ruta desconocida devuelve el
    # índice para que React Router la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
