[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# La URL real se inyecta desde app.core.config en env.py; esta línea queda vacía
# a propósito para que nunca haya credenciales en un archivo versionado.
sqlalchemy.url =

# Sin post_write_hooks: el formateo de las migraciones se hace con `ruff format`,
# no desde Alembic, para que un fallo del formateador no aborte la generación de
# una migración ya escrita en disco.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
