[project]
name = "sigrep-backend"
version = "1.0.0"
description = "SIGREP — Sistema Gerencial de Reportes · Grupo Santa Cruz"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    # `psycopg[binary]` trae la libpq compilada: la imagen no necesita
    # compilador ni cabeceras de PostgreSQL.
    "psycopg[binary]>=3.2.3",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1.5",
    # Cliente HTTP de `FuenteVentaSiesa`. Es dependencia de ejecución, no solo
    # de pruebas: la ingesta desde la API descarga el CSV en streaming —un mes
    # son ~1 000 000 de filas— con timeouts separados de conexión y de lectura.
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
# SQL Server es opcional: instalarlo obliga a añadir el controlador ODBC de
# Microsoft a la imagen. Quien despliegue sobre SQL Server instala
# `.[sqlserver]`.
sqlserver = ["pyodbc>=5.2.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.0",
    "types-openpyxl>=3.1.5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
    "S101",  # assert es el mecanismo natural de las pruebas
    # El código y la documentación están en español: acentos, comillas
    # angulares y guiones largos son ortografía correcta, no caracteres
    # "ambiguos" colados por accidente.
    "RUF001",
    "RUF002",
    "RUF003",
    # Las excepciones de dominio se llaman `ErrorAlgo` en lugar de `AlgoError`
    # por coherencia con el resto del vocabulario del proyecto.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"app/infrastructure/semilla.py" = ["S105", "S106"]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Las migraciones son scripts generados: no se les exige la disciplina de
# tipado del código de aplicación.
module = "alembic.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
