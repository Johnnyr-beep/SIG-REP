name: CI

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main, desarrollo]

# Un push nuevo cancela la ejecución anterior de la misma rama: no tiene sentido
# gastar minutos validando un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Clave ficticia: la configuración se niega a arrancar sin una, y en CI no se
  # firma nada que salga del runner.
  SIGREP_SECRET_KEY: clave-de-integracion-continua-con-mas-de-32-caracteres
  SIGREP_ENTORNO: pruebas

jobs:
  backend:
    name: Backend · lint, tipos, pruebas y migraciones
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Base efímera para verificar las migraciones. Vive lo que vive el job y se
    # destruye con él: `alembic upgrade head` se ejecuta contra un PostgreSQL
    # vacío, que es la única forma de saber que la migración corre de cero.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sigrep_ci
          POSTGRES_USER: sigrep_ci
          POSTGRES_PASSWORD: sigrep_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigrep_ci -d sigrep_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Idéntica a la de la imagen de producción y a `requires-python` de
          # pyproject.toml. Validar en una versión y desplegar en otra es pedir
          # que el fallo aparezca solo en producción.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Formato (ruff format --check)
        run: ruff format --check app tests

      - name: Lint (ruff check)
        run: ruff check app tests

      - name: Tipos (mypy)
        # `strict = true` en pyproject.toml. Sin `continue-on-error`: un error
        # de tipos rompe la compilación, que es justamente para lo que sirve.
        run: mypy app

      - name: Pruebas y cobertura
        env:
          # SQLite en memoria: las pruebas crean el esquema con
          # `Base.metadata.create_all` y no necesitan servidor.
          SIGREP_DB_URL_OVERRIDE: "sqlite://"
        run: pytest --cov=app --cov-report=xml --cov-report=term

      - name: Migraciones sobre una base efímera
        env:
          SIGREP_DB_URL_OVERRIDE: postgresql://sigrep_ci:sigrep_ci@localhost:5432/sigrep_ci
        run: |
          alembic upgrade head
          # `alembic check` compara los modelos con el esquema recién migrado.
          # Detecta el olvido clásico: cambiar un modelo y no generar la
          # migración, que en producción se manifiesta como una columna que no
          # existe.
          alembic check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend · tipos y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        # `npm ci` y no `npm install`: instala exactamente lo del lockfile y
        # falla si el lockfile y package.json divergen.
        run: npm ci --no-audit --no-fund

      - name: Verificar tipos
        run: npm run typecheck

      - name: Compilar
        run: npm run build

  seguridad:
    name: Seguridad · dependencias y secretos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vulnerabilidades conocidas en dependencias Python
        working-directory: backend
        run: |
          python -m venv .venv-audit
          .venv-audit/bin/pip install -q --upgrade pip
          .venv-audit/bin/pip install -q .
          pip install -q pip-audit
          # No rompe la compilación: un aviso nuevo no debe bloquear un
          # despliegue urgente. Se revisa en el tablero de seguridad.
          pip-audit --desc --progress-spinner off --path .venv-audit || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vulnerabilidades conocidas en dependencias Node
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Buscar secretos en el historial
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    # `packages: write` es lo que permite publicar en GHCR con el token que
    # GitHub ya inyecta. No hace falta ningún secreto adicional.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolver el espacio de nombres
        id: ns
        # GHCR solo admite minúsculas y el propietario puede tener mayúsculas.
        run: echo "valor=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Publicar la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: produccion
          push: true
          # `latest` es lo que despliega Dokploy; la etiqueta con el SHA permite
          # volver a una versión concreta sin reconstruir.
          tags: |
            ${{ steps.ns.outputs.valor }}/sigrep-api:latest
            ${{ steps.ns.outputs.valor }}/sigrep-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: produccion
          push: true
          tags: |
            ${{ steps.ns.outputs.valor }}/sigrep-web:latest
            ${{ steps.ns.outputs.valor }}/sigrep-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar en Dokploy
    runs-on: ubuntu-latest
    # Solo se despliega si TODO pasó: formato, lint, tipos, pruebas, migraciones
    # sin deriva y ambas imágenes construidas. Nunca se publica un commit que la
    # integración continua no validó.
    needs: [backend, frontend, imagenes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Con un `environment` protegido en la configuración del repositorio,
    # GitHub puede exigir aprobación manual antes de este paso.
    environment: produccion

    steps:
      - name: Disparar el despliegue
        env:
          # La URL del webhook autoriza a desplegar por sí sola: va en los
          # secretos del repositorio, nunca en este archivo.
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::Falta el secreto DOKPLOY_WEBHOOK_URL."
            exit 1
          fi

          # El webhook de Dokploy espera el cuerpo de un evento push de Git y
          # compara la rama con la que tiene configurada. Un POST vacío se
          # rechaza con {"message":"Branch Not Match"}, así que hay que enviar
          # el `ref` explícitamente.
          codigo=$(curl --silent --show-error --location \
                        --request POST "$WEBHOOK" \
                        --header 'Content-Type: application/json' \
                        --header 'X-GitHub-Event: push' \
                        --data "{\"ref\":\"${GITHUB_REF}\"}" \
                        --max-time 60 \
                        --write-out '%{http_code}' \
                        --output /tmp/respuesta.txt)

          echo "Rama enviada: ${GITHUB_REF}"
          echo "Respuesta de Dokploy (HTTP $codigo):"
          cat /tmp/respuesta.txt || true
          echo

          if grep -qi "not match\|error\|unauthorized" /tmp/respuesta.txt 2>/dev/null; then
            echo "::error::Dokploy rechazó el disparo: $(cat /tmp/respuesta.txt)"
            echo "::error::Verifique que la rama configurada en el servicio sea 'main'."
            exit 1
          fi

          case "$codigo" in
            200 | 201 | 202) echo "Despliegue disparado correctamente." ;;
            *) echo "::error::Dokploy respondió HTTP $codigo."; exit 1 ;;
          esac

      - name: Recordatorio de verificación
        run: |
          echo "::notice::Verifique en el panel de Dokploy que la construcción terminó."
          echo "::notice::Después compruebe /api/v1/salud y /listo en el dominio."
